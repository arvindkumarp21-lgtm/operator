<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ગુજરાત પુરવઠા ઓપરેટર</title>

  <!-- Inline Dynamic PWA Manifest -->
  <link id="pwa-manifest" rel="manifest" href="" />

  <!-- Tailwind CSS & Google Fonts (Noto Sans Gujarati) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Noto Sans Gujarati', sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    .live-dot {
      animation: pulse-dot 1.5s infinite;
    }
  </style>
</head>
<body class="text-slate-800 antialiased select-none sm:select-auto">

  <!-- Toast Notification -->
  <div id="toast-box" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-sm w-[92%] px-4 py-3 rounded-xl shadow-xl text-white text-sm font-medium flex items-center justify-between transition-all duration-300">
    <span id="toast-msg">સંદેશ</span>
    <button onclick="hideToast()" class="ml-3 text-white/80 hover:text-white font-bold">&times;</button>
  </div>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="login-screen" class="min-h-screen flex flex-col justify-center items-center p-4 bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-900">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">
      <div class="bg-blue-900 px-6 py-8 text-center text-white relative">
        <div class="w-16 h-16 mx-auto bg-white/15 backdrop-blur rounded-2xl flex items-center justify-center mb-3 border border-white/20 shadow-inner">
          <svg class="w-9 h-9 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-wide">ગુજરાત પુરવઠા ઓપરેટર</h1>
        <p class="text-blue-200 text-xs mt-1">ઓપરેટર મેનેજમેન્ટ અને ડિરેક્ટરી પોર્ટલ</p>
      </div>

      <form id="login-form" onsubmit="handleManualLogin(event)" class="p-6 space-y-5">
        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs font-semibold"></div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">મોબાઇલ નંબર (૧૦ આંકડા)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm font-semibold">+91</span>
            <input type="tel" id="login-mobile" maxlength="10" inputmode="numeric" required autocomplete="off"
              placeholder="મોબાઇલ નંબર દાખલ કરો"
              class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">પાસવર્ડ</label>
          <div class="relative">
            <input type="password" id="login-password" required autocomplete="off"
              placeholder="પાસવર્ડ દાખલ કરો"
              class="w-full pl-4 pr-11 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" />
            <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 bg-blue-900 hover:bg-blue-800 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-blue-900/30 transition text-sm">
          સુરક્ષિત લૉગિન કરો
        </button>

        <div id="install-banner" class="hidden pt-2">
          <button type="button" onclick="triggerPWAInstall()"
            class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow">
            <span>📲 મોબાઇલ / પીસીમાં એપ ઇન્સ્ટોલ કરો</span>
          </button>
        </div>
      </form>
    </div>
    <p class="text-blue-200/70 text-[11px] mt-4">ગુજરાત પુરવઠા ઓપરેટર PWA • સુરક્ષિત લાઇવ સિસ્ટમ</p>
  </div>

  <!-- ================= MAIN APP SHELL ================= -->
  <div id="app-shell" class="hidden min-h-screen pb-24 max-w-3xl mx-auto bg-slate-50 shadow-xl">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-blue-950 text-white px-4 py-3.5 shadow-md flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-400 text-blue-950 font-bold flex items-center justify-center text-base shadow">
          ગુ
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">ગુજરાત પુરવઠા ઓપરેટર</h1>
          <div class="flex items-center gap-2 text-[11px] text-blue-200">
            <span id="header-user-name" class="font-medium truncate max-w-[140px]">ઓપરેટર</span>
            <span>•</span>
            <span id="header-role-badge" class="px-1.5 py-0.5 rounded bg-blue-800 text-amber-300 font-semibold">OPERATOR</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div id="sync-indicator" title="લાઇવ સિંક સ્થિતિ" class="flex items-center gap-1.5 bg-white/10 px-2.5 py-1 rounded-full text-[11px]">
          <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-400 live-dot"></span>
          <span id="sync-text" class="font-medium">LIVE</span>
        </div>
        <button onclick="manualSyncNow()" title="ડેટા રિફ્રેશ/સિંક કરો" class="p-2 rounded-xl bg-white/10 hover:
